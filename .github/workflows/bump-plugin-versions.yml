name: Bump plugin versions

# After a merge to main that changes plugin content, patch-bump the version in
# each affected plugin's plugin.json so clients with auto-update enabled pick up
# the change (Claude Code only re-installs a plugin when its resolved version
# differs from the cached one).
#
# The bump lands through a PR that this workflow opens and immediately
# squash-merges: the main ruleset requires changes to go through a pull
# request, and on user-owned repos GitHub refuses to add the Actions app as a
# ruleset bypass actor ("must be part of the ruleset source or owner
# organization"), so a direct push from this workflow can never succeed. The
# immediate self-merge works because the ruleset requires no approvals or
# status checks; if either is ever added, this merge step will start failing
# and the workflow will need a different actor (e.g. a deploy key) instead.
#
# Loop safety: pushes and merges made with the default GITHUB_TOKEN do not
# trigger new workflow runs, and a plugin whose version already changed in the
# same push (i.e. the PR bumped it manually) is skipped.

on:
  push:
    branches: [main]
    paths:
      - "plugins/**"

concurrency:
  group: bump-versions
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Bump versions for changed plugins
        run: |
          set -euo pipefail
          shopt -s nullglob

          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"
          # On force pushes or brand-new branches BEFORE can be missing/zeros.
          if ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            BEFORE="${AFTER}~1"
          fi

          changed=0
          for manifest in plugins/*/.claude-plugin/plugin.json; do
            plugin_dir=$(dirname "$(dirname "$manifest")")

            if git diff --quiet "$BEFORE" "$AFTER" -- "$plugin_dir"; then
              continue
            fi

            version=$(jq -r '.version // empty' "$manifest")
            if [ -z "$version" ]; then
              echo "$plugin_dir: no version field (every commit is a new version), skipping"
              continue
            fi

            old_version=$(git show "$BEFORE:$manifest" 2>/dev/null | jq -r '.version // empty' || true)
            if [ -n "$old_version" ] && [ "$old_version" != "$version" ]; then
              echo "$plugin_dir: version already bumped in this push ($old_version -> $version), skipping"
              continue
            fi

            new_version=$(echo "$version" | awk -F. '{printf "%d.%d.%d", $1, $2, $3 + 1}')
            jq --arg v "$new_version" '.version = $v' "$manifest" > "$manifest.tmp"
            mv "$manifest.tmp" "$manifest"
            echo "$plugin_dir: $version -> $new_version"
            changed=1
          done

          if [ "$changed" -eq 1 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            branch="bump-plugin-versions/${{ github.run_id }}"
            git checkout -b "$branch"
            git add plugins/*/.claude-plugin/plugin.json
            git commit -m "chore: bump plugin versions after content change"
            git push -u origin "$branch"
            gh pr create \
              --base main \
              --head "$branch" \
              --title "chore: bump plugin versions after content change" \
              --body "Automated patch bump for plugins changed in ${AFTER}."
            gh pr merge "$branch" --squash --delete-branch
          else
            echo "No version bumps needed."
          fi
        env:
          GH_TOKEN: ${{ github.token }}
