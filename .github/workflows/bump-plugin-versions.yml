name: Bump plugin versions

# After a merge to main that changes plugin content, patch-bump the version in
# each affected plugin's plugin.json so clients with auto-update enabled pick up
# the change (Claude Code only re-installs a plugin when its resolved version
# differs from the cached one).
#
# The bump is pushed directly to main using a deploy key. The default
# GITHUB_TOKEN cannot land the bump on a user-owned repo with a PR-required
# ruleset:
#   - a direct push fails because GitHub refuses to add the Actions app as a
#     ruleset bypass actor ("must be part of the ruleset source or owner
#     organization");
#   - opening a bump PR and self-merging fails because "Allow GitHub Actions
#     to create and approve pull requests" is disabled in the repo's Actions
#     settings.
# A deploy key with write access, added to the main ruleset's bypass list
# (bypass actor role "Deploy keys"), is the supported way around both.
#
# One-time setup:
#   1. ssh-keygen -t ed25519 -N '' -C 'bump-plugin-versions deploy key' -f deploy-key
#   2. Settings -> Deploy keys -> Add deploy key: paste deploy-key.pub and
#      check "Allow write access"
#   3. Settings -> Secrets and variables -> Actions -> New repository secret:
#      name DEPLOY_KEY, value = contents of the private key file "deploy-key"
#   4. Settings -> Rules -> Rulesets -> (main ruleset) -> Bypass list ->
#      add "Deploy keys"
#   5. Delete the local keypair files.
#
# Loop safety: unlike GITHUB_TOKEN pushes, deploy-key pushes DO trigger
# workflow runs, so the bump commit re-triggers this workflow once. That
# second run must no-op, and it does: a plugin whose version already changed
# in the pushed range — including this workflow's own bump commit — is
# skipped. Do not remove that guard; it is what terminates the loop.

on:
  push:
    branches: [main]
    paths:
      - "plugins/**"

concurrency:
  group: bump-versions
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.DEPLOY_KEY }}

      - name: Bump versions for changed plugins
        run: |
          set -euo pipefail
          shopt -s nullglob

          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"
          # On force pushes or brand-new branches BEFORE can be missing/zeros.
          if ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            BEFORE="${AFTER}~1"
          fi

          changed=0
          for manifest in plugins/*/.claude-plugin/plugin.json; do
            plugin_dir=$(dirname "$(dirname "$manifest")")

            if git diff --quiet "$BEFORE" "$AFTER" -- "$plugin_dir"; then
              continue
            fi

            version=$(jq -r '.version // empty' "$manifest")
            if [ -z "$version" ]; then
              echo "$plugin_dir: no version field (every commit is a new version), skipping"
              continue
            fi

            old_version=$(git show "$BEFORE:$manifest" 2>/dev/null | jq -r '.version // empty' || true)
            if [ -n "$old_version" ] && [ "$old_version" != "$version" ]; then
              echo "$plugin_dir: version already bumped in this push ($old_version -> $version), skipping"
              continue
            fi

            new_version=$(echo "$version" | awk -F. '{printf "%d.%d.%d", $1, $2, $3 + 1}')
            jq --arg v "$new_version" '.version = $v' "$manifest" > "$manifest.tmp"
            mv "$manifest.tmp" "$manifest"
            echo "$plugin_dir: $version -> $new_version"
            changed=1
          done

          if [ "$changed" -eq 1 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add plugins/*/.claude-plugin/plugin.json
            git commit -m "chore: bump plugin versions after content change"
            # If main advanced since checkout, rebase once and retry.
            git push origin HEAD:main \
              || (git pull --rebase origin main && git push origin HEAD:main)
          else
            echo "No version bumps needed."
          fi
